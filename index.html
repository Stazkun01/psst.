      else if (/Android/.test(ua)) { const m = ua.match(/Android [\d.]+; ([^;)]+)/); device = m && m[1].trim().length > 2 ? m[1].trim() : 'Android phone'; }

      else if (/Windows/.test(ua)) device = 'Windows PC';
      else device = 'computer';
    }
    let geo = {};
    try { const r = await fetch('/api/geo', { cache: 'no-store' }); if (r.ok) geo = await r.json(); } catch {}
    return { device, city: geo.city || null, country: geo.country || null };
  })();
  return hintsP;
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
let memToken = null;
const token = () => store.get('psst_token') || memToken;
const setToken = t => { memToken = t; store.set('psst_token', t); };

async function rpc(fn, args = {}) {
  const r = await fetch(`${SB}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  });
  const txt = await r.text();
  let d = null; try { d = txt ? JSON.parse(txt) : null; } catch {}
  if (!r.ok) {
    const e = new Error((d && d.message) || 'error');
    if (e.message === 'not_logged_in') { setToken(null); go('/'); }
    throw e;
  }
  return d;
}

let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

function ago(iso) {
  const s = Math.max(1, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function route() {

async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const i = document.createElement('input'); i.value = text; document.body.appendChild(i);
    i.select(); try { document.execCommand('copy'); } catch {} i.remove();
  }
  toast('link copied ✨');
}

const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const pushOK = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
function b64u(s) { const p = '='.repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); }
async function renderBell() {
  const el = $('#bell'); if (!el) return;
  let html = '';
  if (!isStandalone() && (isIOS || isAndroid || inAppBrowser)) {
    html = `<div class="install"><span class="be">📲</span><span>add psst to your home screen<small>${isIOS ? 'needed for notifications on iPhone' : 'opens like a real app + notifications'}</small></span><button id="inst">show me</button></div>`;
  } else if (!pushOK()) {
    html = '';
  } else if (Notification.permission === 'denied') {
    html = `<div class="bell"><span class="be">🔕</span><span>notifications are blocked. turn them on for psst in your phone settings</span></div>`;
  } else {
    let sub = null;
    try { const reg = await navigator.serviceWorker.ready; sub = await reg.pushManager.getSubscription(); } catch {}
    if (!sub || Notification.permission !== 'granted') html = `<div class="bell"><span class="be">🔔</span><span>get notified when someone sends you a message</span><button id="pushOn">turn on</button></div>`;
    else rpc('save_push', { p_token: token(), p_sub: sub.toJSON() }).catch(() => {});
  }
  el.innerHTML = html;
  const b = $('#pushOn'); if (b) b.onclick = enablePush;
  const ib = $('#inst'); if (ib) ib.onclick = showInstall;
}
async function enablePush() {
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { toast('notifications not allowed'); return renderBell(); }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(me.vapid) });
    await rpc('save_push', { p_token: token(), p_sub: sub.toJSON() });
    toast('notifications on 🔔'); renderBell();
  } catch (e) { toast("couldn't turn on notifications on this device"); }
}

    ['open <b>psst</b> from your home screen and tap <b>turn on</b>', 'that turns on notifications for new messages 🔔', null],

}

function tabbedSheet(title, intro, tabs, start) {
  const s = sheet(`<h2>${title}</h2>${intro ? `<p style="color:var(--muted);font-weight:600;font-size:15px;margin-top:-4px">${intro}</p>` : ''}
    <div class="tabs" style="margin:0">${tabs.map(([k, label]) => `<button data-k="${k}">${label}</button>`).join('')}</div><div id="tabBody"></div>
    <button class="btn" id="gotIt">got it 👍</button>`);
  const show = k => {
    s.el.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.k === k));
    $('#tabBody', s.el).innerHTML = stepsHtml(tabs.find(t => t[0] === k)[2]());
  };
  s.el.querySelectorAll('.tabs button').forEach(b => b.onclick = () => show(b.dataset.k));
  $('#gotIt', s.el).onclick = () => s.close();
  show(start);
  return s;
}
function showHowTo(start, welcome) {

    welcome ? 'here’s how to get messages. it takes 30 seconds' : null,
    [['instagram', '📸 instagram', () => igSteps(false)], ['snapchat', '👻 snapchat', snapSteps]], start);
}
function showInstall() {

    [['iphone', '📱 iPhone', iphoneSteps], ['android', '🤖 Android', androidSteps]], isAndroid ? 'android' : 'iphone');
}

/* ---------- profile pic ---------- */
function pickAvatar() {
  return new Promise(resolve => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
    i.onchange = async () => {
      const f = i.files && i.files[0]; if (!f) return resolve(null);
      try {
        const img = await new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = URL.createObjectURL(f); });
        const S = 256, c = document.createElement('canvas'); c.width = c.height = S;
        const k = Math.max(S / img.width, S / img.height), w = img.width * k, h = img.height * k;
        c.getContext('2d').drawImage(img, (S - w) / 2, (S - h) / 2, w, h);
        resolve(c.toDataURL('image/jpeg', 0.85));
      } catch { resolve(null); }
    };
    i.click();
  });
}

/* ---------- share flow ---------- */
let promoFile = null;
function quietCopy(text) {
  try { return navigator.clipboard.writeText(text).then(() => true, () => false); } catch { return Promise.resolve(false); }
}
async function shareToStory(url) {
  const copied = quietCopy(url); // same tap as the share, so the browser allows both
  const file = promoFile;
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    toast('link copied 🔗 pick instagram → story, then add the link sticker');
    try { await navigator.share({ files: [file] }); }
    catch (e) { if (e.name !== 'AbortError') showPromo(url); }
    return;
  }
  await copied;
  showPromo(url);
}
async function showPromo(url) {
  const blob = promoFile || await makePromo(me);
  const src = URL.createObjectURL(blob);
  const s = sheet(`
    <h2>your story pic</h2>
    <img class="preview" src="${src}" alt="story picture with your prompt">
    <a class="btn big" href="${src}" download="psst-story.png">save pic</a>
    <button class="btn soft" id="cp">copy link</button>
    ${stepsHtml(igSteps(true))}`);
  $('#cp', s.el).onclick = () => copy(url);
}
function setupSnap(url) {
  const btn = $('#shareSnap');
  btn.onclick = () => {
    quietCopy(url);
    // fallback if snapchat's share script didn't load: open snapchat with the link attached
    if (!window.__snapReady) location.href = 'https://www.snapchat.com/scan?attachmentUrl=' + encodeURIComponent(url);
  };
  const init = () => {
    try { snap.creativekit.initalizeShareButtons(document.getElementsByClassName('snapchat-share-button')); window.__snapReady = true; } catch {}
  };
  if (window.snap && window.snap.creativekit) return init();
  window.snapKitInit = init;
  if (!document.getElementById('snapkit-creative-kit-sdk')) {
    const js = document.createElement('script'); js.id = 'snapkit-creative-kit-sdk';
    js.src = 'https://sdk.snapkit.com/js/v1/create.js'; document.body.appendChild(js);
  }
}

/* ---------- story image ---------- */
function wrap(ctx, text, maxW) {
  const out = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (let word of para.split(/\s+/)) {
      if (!word) continue;
      while (ctx.measureText(word).width > maxW) {
        let i = word.length; while (i > 1 && ctx.measureText(word.slice(0, i)).width > maxW) i--;
        if (line) { out.push(line); line = ''; }
        out.push(word.slice(0, i)); word = word.slice(i);
      }
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxW && line) { out.push(line); line = word; } else line = test;
    }
    out.push(line);
  }
  return out;
}
function rr(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
async function makeStory(prompt, body, answer, username, game) {
  try { await Promise.all(['900 60px Outfit', '800 60px Outfit', '700 60px Outfit', '600 30px Outfit'].map(f => document.fonts.load(f))); } catch {}
  const W = 1080, H = 1920, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); storyBg(x, W, H, game);

  const CW = 900, CX = (W - CW) / 2;
  let L;
  for (let s = 1; s >= 0.5; s -= 0.05) {
    const hs = 42 * s, bs = 66 * s, as = 52 * s, pad = 52 * s;
    x.font = `800 ${hs}px Outfit, sans-serif`; const pl = wrap(x, prompt, CW - pad * 2);
    x.font = `800 ${bs}px Outfit, sans-serif`; const bl = wrap(x, body, CW - pad * 2);
    x.font = `700 ${as}px Outfit, sans-serif`; const al = answer ? wrap(x, answer, CW - pad * 2) : [];
    const headH = pad * 1.4 + pl.length * hs * 1.25, bodyH = pad * 2 + bl.length * bs * 1.25;
    const ansH = al.length ? pad * 2 + al.length * as * 1.3 : 0;
    const total = headH + bodyH + (ansH ? 36 + ansH : 0);
    L = { hs, bs, as, pad, pl, bl, al, headH, bodyH, ansH, total };
    if (total < H - 520) break;
  }
  let y = Math.max(200, (H - L.total) / 2 - 70);

  // question card
  x.save(); x.shadowColor = 'rgba(30,5,70,.35)'; x.shadowBlur = 60; x.shadowOffsetY = 20;
  rr(x, CX, y, CW, L.headH + L.bodyH, 54); x.fillStyle = '#14121f'; x.fill(); x.restore();
  x.save(); rr(x, CX, y, CW, L.headH + L.bodyH, 54); x.clip();
  const hg = x.createLinearGradient(CX, y, CX + CW, y + L.headH); hg.addColorStop(0, G(game).c[0]); hg.addColorStop(1, G(game).c[2]);
  x.fillStyle = hg; x.fillRect(CX, y, CW, L.headH);
  x.fillStyle = '#fff'; x.textBaseline = 'top'; x.font = `800 ${L.hs}px Outfit, sans-serif`;
  L.pl.forEach((ln, i) => x.fillText(ln, CX + L.pad, y + L.pad * 0.7 + i * L.hs * 1.25));
  x.fillStyle = '#fff'; x.font = `800 ${L.bs}px Outfit, sans-serif`;
  L.bl.forEach((ln, i) => x.fillText(ln, CX + L.pad, y + L.headH + L.pad + i * L.bs * 1.25));
  x.restore();
  y += L.headH + L.bodyH;

  // answer bubble
  if (L.ansH) {
    y += 36;
    x.save(); x.shadowColor = 'rgba(30,5,70,.25)'; x.shadowBlur = 40; x.shadowOffsetY = 12;
    rr(x, CX, y, CW, L.ansH, 46); x.fillStyle = '#ffe14d'; x.fill(); x.restore();
    x.fillStyle = '#14121f'; x.font = `700 ${L.as}px Outfit, sans-serif`; x.textBaseline = 'top';
    L.al.forEach((ln, i) => x.fillText(ln, CX + L.pad, y + L.pad + i * L.as * 1.3));
  }

  // branding
  x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  x.font = '900 84px Outfit, sans-serif'; const w1 = x.measureText('psst').width, w2 = x.measureText('.').width;
  x.textAlign = 'left'; const bx = (W - w1 - w2) / 2;
  x.fillStyle = '#fff'; x.fillText('psst', bx, H - 190); x.fillStyle = '#ffe14d'; x.fillText('.', bx + w1, H - 190);
  x.textAlign = 'center'; x.fillStyle = 'rgba(255,255,255,.92)'; x.font = '600 36px Outfit, sans-serif';
  x.fillText('send me anonymous messages 👆 link in story', W / 2, H - 125);

  return new Promise(r => c.toBlob(r, 'image/png'));
}

function storyBg(x, W, H, game) {
  const cs = G(game).c, g = x.createLinearGradient(0, 0, W * 0.55, H);
  g.addColorStop(0, cs[0]); g.addColorStop(.45, cs[1]); g.addColorStop(1, cs[2]);
  x.fillStyle = g; x.fillRect(0, 0, W, H);
}
async function makePromo(p) {
  const username = p.username, prompt = p.prompt, game = p.game;
  let av = null;
  if (p.avatar) { try { av = await new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = p.avatar; }); } catch {} }
  try { await Promise.all(['900 60px Outfit', '800 60px Outfit', '700 60px Outfit', '600 30px Outfit'].map(f => document.fonts.load(f))); } catch {}
  const W = 1080, H = 1920, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); storyBg(x, W, H, game);
  const CW = 880, CX = (W - CW) / 2, pad = 56;
  x.font = '800 68px Outfit, sans-serif'; const pl = wrap(x, prompt, CW - pad * 2).slice(0, 4);
  const top = 150, cardH = top + pl.length * 82 + pad + 70;
  let y = 520;
  // card
  x.save(); x.shadowColor = 'rgba(30,5,70,.35)'; x.shadowBlur = 70; x.shadowOffsetY = 24;
  rr(x, CX, y, CW, cardH, 60); x.fillStyle = '#fff'; x.fill(); x.restore();
  // avatar + handle
  const ag = x.createLinearGradient(CX + pad, y + pad, CX + pad + 96, y + pad + 96);
  ag.addColorStop(0, G(game).c[0]); ag.addColorStop(1, G(game).c[2]);
  x.fillStyle = ag; x.beginPath(); x.arc(CX + pad + 48, y + pad + 48, 48, 0, Math.PI * 2); x.fill();
  if (av) { x.save(); x.beginPath(); x.arc(CX + pad + 48, y + pad + 48, 48, 0, Math.PI * 2); x.clip(); x.drawImage(av, CX + pad, y + pad, 96, 96); x.restore(); }
  else { x.fillStyle = '#fff'; x.font = '900 52px Outfit, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(username[0].toUpperCase(), CX + pad + 48, y + pad + 51); }
  x.textBaseline = 'middle';
  x.textAlign = 'left'; x.fillStyle = '#6b6880'; x.font = '700 38px Outfit, sans-serif';
  x.fillText('@' + username, CX + pad + 120, y + pad + 50);
  // prompt
  x.textBaseline = 'top'; x.fillStyle = '#14121f'; x.font = '800 68px Outfit, sans-serif';
  pl.forEach((ln, i) => x.fillText(ln, CX + pad, y + top + 10 + i * 82));
  // lock line
  x.fillStyle = G(game).c[1]; x.font = '700 34px Outfit, sans-serif';
  x.fillText(`${G(game).emoji} ${G(game).name} · 🔒 anonymous`, CX + pad, y + cardH - pad - 34);
  y += cardH;
  // where the link sticker goes
  x.textAlign = 'center'; x.textBaseline = 'alphabetic'; x.font = '84px Outfit, sans-serif';
  x.fillText('👇 👇 👇', W / 2, y + 190);
  const bw = 620, bh = 150, by = y + 250;
  x.save(); x.setLineDash([22, 16]); x.lineWidth = 7; x.strokeStyle = 'rgba(255,255,255,.9)';
  rr(x, (W - bw) / 2, by, bw, bh, 75); x.stroke(); x.restore();
  x.fillStyle = 'rgba(255,255,255,.85)'; x.font = '700 40px Outfit, sans-serif'; x.textBaseline = 'middle';
  x.fillText('put your link here', W / 2, by + bh / 2);
  // branding
  x.textBaseline = 'alphabetic'; x.font = '900 84px Outfit, sans-serif';
  const w1 = x.measureText('psst').width, w2 = x.measureText('.').width, bx = (W - w1 - w2) / 2;
  x.textAlign = 'left'; x.fillStyle = '#fff'; x.fillText('psst', bx, H - 170); x.fillStyle = '#ffe14d'; x.fillText('.', bx + w1, H - 170);
  return new Promise(r => c.toBlob(r, 'image/png'));
}

/* ---------- settings ---------- */
function showSettings() {
  const s = sheet(`
    <h2>settings</h2>
    <div class="pfp"><div class="avatar" id="pfpv">${avatarHtml(me)}</div><div class="btns"><button id="pfpc">📷 change profile pic</button>${me.avatar ? '<button class="rm" id="pfpr">remove</button>' : ''}</div></div>
    <label>your prompt<input id="sp" maxlength="80" value="${esc(me.prompt)}"></label>
    <label class="toggle"><input type="checkbox" id="spause" ${me.paused ? 'checked' : ''}> pause new messages</label>
    <label>hide messages containing these words (comma separated)<textarea id="sf" rows="2" placeholder="e.g. ugly, loser">${esc((me.filter_words || []).join(', '))}</textarea></label>
    <button class="btn big" id="save">save</button>
    <hr>
    <button class="btn soft" id="out">log out</button>
    <button class="linkbtn" id="delacc">delete my account</button>`);
  const el = s.el;
  $('#pfpc', el).onclick = async () => {
    const d = await pickAvatar(); if (!d) return;
    try { await rpc('set_avatar', { p_token: token(), p_avatar: d }); me.avatar = d; toast('profile pic updated ✨'); el.remove(); showInbox(); }
    catch (e) { toast("couldn't use that picture"); }
  };
  const rm = $('#pfpr', el); if (rm) rm.onclick = async () => { await rpc('set_avatar', { p_token: token(), p_avatar: null }).catch(() => {}); toast('removed'); el.remove(); showInbox(); };
  $('#save', el).onclick = async () => {
    const words = $('#sf', el).value.split(',').map(w => w.trim().toLowerCase()).filter(Boolean).slice(0, 100);
    try {
      await rpc('update_settings', { p_token: token(), p_prompt: $('#sp', el).value, p_paused: $('#spause', el).checked, p_filter_words: words });
      toast('saved ✓'); el.remove(); showInbox();
    } catch (e) { toast(errText(e)); }
  };
  $('#out', el).onclick = async () => { await rpc('logout', { p_token: token() }).catch(() => {}); setToken(null); go('/'); };
  $('#delacc', el).onclick = async () => {
    const pw = prompt('type your password to delete your account and all messages forever');
    if (!pw) return;
    try { await rpc('delete_account', { p_token: token(), p_password: pw }); setToken(null); toast('account deleted'); go('/'); }
    catch (e) { toast(errText(e)); }
  };
}
